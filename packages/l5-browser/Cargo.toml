[package]
name = "aether-l5-browser"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Aether L5 — browser-automation capability surface (T1.3 §2.1). Trait + types + Playwright-stub backend; real subprocess wiring lands in a later slice."

[lib]
path = "src/lib.rs"

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# T1.3 — async trait surface for `BrowserExecutor`. `async-trait` is the
# de-facto crate for object-safe async traits on stable Rust 1.78. Version
# pinned locally because no other Aether crate currently uses it; promote
# to workspace deps when a second crate adopts it.
async-trait = "0.1"

aether-l5-policy = { path = "../l5-policy" }

[features]
# Default build ships the trait + types + capability map only. The
# Playwright-backed executor is gated behind the `playwright` feature so
# default builds do not pull subprocess / transport infra. The real
# Playwright impl (Node subprocess, IPC framing) lands in a later slice;
# the current `playwright_stub` module is structurally complete but every
# method returns `BrowserExecError::BackendDisabled`.
default = []
playwright = []
