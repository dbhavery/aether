[package]
name = "aether-l2-memory"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "L2 — memory kernel shell (Wave 4 stub)."

[lib]
path = "src/lib.rs"

[dependencies]
thiserror = { workspace = true }
serde     = { workspace = true }
tracing   = { workspace = true }

aether-l5-policy = { path = "../l5-policy" }
aether-storage   = { path = "../storage" }

# Memory V2 step 6 (ADR-0002) — embeddings feature. Kept as optional
# deps so the default build pays zero compile cost. `ureq` is pulled
# in as a pure-Rust blocking HTTP client (same pattern L4 uses for
# its Ollama provider).
serde_json = { workspace = true, optional = true }
ureq       = { version = "2", default-features = false, features = ["json"], optional = true }

[dev-dependencies]
tempfile   = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
# Enables the durable SQLite-backed `SessionMemoryStore` implementation.
# Default build stays in-memory; opt-in for Tauri/desktop apps that want
# conversation continuity across restarts. Depends on `aether-storage`
# already being on the workspace path.
sqlite-backend = []
# Memory V2 step 6 — embeddings (opt-in, local-only). Pulls in the
# `EmbeddingStore` trait, `FlatFileEmbeddingStore`, and
# `OllamaEmbeddingProvider`. Off by default; the shell enables this
# feature and ships the toggle via `memory.json::embeddings.enabled`.
embeddings = ["dep:serde_json", "dep:ureq"]
