[package]
name = "aether-l1-interaction"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "L1 — interaction / timing / reflex orchestration shell (Wave 4 stub)."

[lib]
path = "src/lib.rs"

[dependencies]
thiserror = { workspace = true }
serde     = { workspace = true }
tracing   = { workspace = true }

aether-l5-policy = { path = "../l5-policy" }

[features]
default = []
# Enable the sqlite-backend feature of `aether-l5-policy` for the durable-L5
# integration test in `tests/turn_slice_sqlite.rs`. Opt-in because it pulls in
# `rusqlite` via the L5 crate.
sqlite-backend = ["aether-l5-policy/sqlite-backend"]

[dev-dependencies]
tempfile = { workspace = true }
