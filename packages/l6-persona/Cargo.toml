[package]
name = "aether-l6-persona"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "L6 — persona compiler / companion-identity shell (Wave 4 stub)."

[lib]
path = "src/lib.rs"

[dependencies]
thiserror = { workspace = true }
serde     = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
tracing   = { workspace = true }
# Install primitives (ADR-0012): SHA-256 manifest verification +
# zip-bundle extraction. Both pure-Rust, no system lib dependencies.
sha2      = { workspace = true }
zip       = { version = "2", default-features = false, features = ["deflate"] }
# ADR-0012 §6 — Ed25519 manifest signature verification at runtime.
ed25519-dalek = { workspace = true }
base64    = { workspace = true }

aether-l5-policy = { path = "../l5-policy" }

[dev-dependencies]
tempfile = { workspace = true }
# Cross-language verifier integration test consistency check.
base64    = { workspace = true }
