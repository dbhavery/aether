[package]
name = "aether-l4-router"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "L4 — model / tool router shell (Wave 4 stub)."

[lib]
path = "src/lib.rs"

[dependencies]
thiserror = { workspace = true }
serde     = { workspace = true }
serde_json = { workspace = true }
tracing   = { workspace = true }

aether-l5-policy = { path = "../l5-policy" }

# Optional HTTP client for the Ollama provider. `ureq` is pure-Rust,
# blocking, and needs no TLS deps for localhost-only Ollama. Behind a
# feature so the default OSS build stays network-free.
ureq = { version = "2", default-features = false, features = ["json"], optional = true }

[features]
default = []
# Enable the local Ollama provider adapter. Opt-in at both build and run
# time — see `packages/l4-router/src/providers/ollama.rs`.
ollama-provider = ["dep:ureq"]
