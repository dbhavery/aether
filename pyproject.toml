[project]
name = "aether"
version = "1.0.0"
description = "Modular AI assistant framework with voice I/O, multi-LLM routing, persistent memory, and animated avatar"
authors = [{name = "Don Havery"}]
requires-python = ">=3.13"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 30

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "desktop", "scripts", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # ruff-specific
    "S",      # flake8-bandit (security)
    "T20",    # flake8-print
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "S101",   # assert used (OK in tests)
    "T201",   # print found (we use print in scripts)
    "B008",   # function call in default arg (FastAPI Depends)
    # Style preferences — the codebase favours explicit forms over these refactors:
    "TC001",  # move app import into TYPE_CHECKING block
    "TC003",  # move stdlib import into TYPE_CHECKING block
    "SIM101", # merge isinstance calls
    "SIM102", # combine nested ifs
    "SIM105", # use contextlib.suppress instead of try/except/pass
    "SIM108", # use ternary
    "RUF002", # ambiguous unicode in docstrings (en-dash is intentional)
    "RUF006", # asyncio.create_task ref not stored (fire-and-forget by design)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106", "S110", "T201"]
"scripts/**/*.py" = ["T201"]
"src/avatar/server.py" = ["S404", "S603"]  # subprocess used for launching known avatar scripts
"src/core/server.py" = ["S110"]  # best-effort rate-limit-error send; client may have disconnected
"src/desktop_legacy/**" = ["S104"]  # legacy PySide6 module not on the v1.0 path

[tool.ruff.lint.isort]
known-first-party = ["src", "desktop"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
exclude = ["**/__pycache__", ".venv", "build", "dist"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build"]
skips = ["B101", "B404", "B603"]  # B404/B603: subprocess used for launching known avatar server scripts
