      Natural skin texture with visible pores, no makeup, slim
      athletic frame, a single thin gold chain. Shot on 85mm at
      f/1.8. Looks like a friend across the table, not a model.
      Avoid glamour pose, plastic skin, perfect symmetry, anime,
