# Provenance for every shipped asset. Every row must carry a source +
# license the audit tool can verify. See PERSONA-SCHEMA.md §4 and §8.
assets:
  anchor:
    source: "ai_generated"
    generator: "fal.ai fal-ai/flux-pro/v1.1-ultra"
    generation_date: "2026-04-28"
    source_url: "https://v3b.fal.media/files/b/0a982484/Ijui4cvhYR2Y9VvxNu5sT_47f1d510630f4393b4eb0bc98686dd28.jpg"
    raw_dimensions: [2752, 1536]
    post_processing: "JPG -> PNG re-encode via PIL (no crop, sizing deferred per Don 2026-04-28)"
    role: "canonical neutral face reference for the pack"
    prompt: >-
      Photorealistic neutral reference portrait of a woman in her
      early 30s with shoulder length wavy honey auburn hair tucked
      simply behind both ears, hazel green eyes, light freckles
      across the bridge of her nose, neutral relaxed expression,
      mouth softly closed with the very faintest hint of a smile,
      looking directly at the camera. Even diffuse soft light with
      no harsh shadows, very subtle warm undertone. Plain neutral
      pale beige background, no objects in frame, simple wardrobe
      of a thin neutral cream knit top with a high collar. Real
      skin texture with visible pores, no makeup, slim athletic
      build. Shot on 85mm at f/4 for clean focus across the face,
      sharp on the eyes. Square head and upper shoulders composition,
      anchor reference photo style: calm, present, not styled.
      Avoid plastic skin, perfect symmetry, glamour pose, anime,
      gradient backgrounds, side rim lighting, motion blur.
    license: "custom_aether"

  portrait:
