schema_version: 1

# Reference file for Chatterbox voice cloning. Relative to this yaml.
reference_wav: "reference.wav"

# Short preview used in the wizard.
sample_wav: "sample.wav"

# Chatterbox knobs — Aurora leans slightly less exaggerated than default
# to match her grounded tone. Calm but present, not theatrical.
chatterbox:
  exaggeration: 0.45
  cfg_weight: 0.5
  temperature: 0.75

# ElevenLabs is opt-in per-user; leave voice_id blank until an Aurora-
# equivalent voice is mapped by the shipping team. Model + defaults kept
# so a user adding an id later does not have to hand-edit the whole block.
elevenlabs:
  voice_id: ""
  model_id: "eleven_flash_v2_5"
  stability: 0.55
  similarity_boost: 0.75
  style: 0.15
