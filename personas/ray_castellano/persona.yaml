  engine: "liveportrait"
  resolution: [1024, 1024]
  target_fps: 25
  idle_blink_rate_hz: 0.26
  idle_micro_movement_scale: 0.62

memory:
  isolation: true
  retention_days: 365
  persona_can_forget: true

llm_preferences:
  preferred_tier: "main"
  temperature: 0.7
  max_output_tokens: 768
